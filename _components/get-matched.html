<!-- AXIANT-GETMATCHED:START (synced from _components/get-matched.html by scripts/sync-get-matched.py - edit the component, never this copy) -->
<style>
.ax-gm{margin:0 0 28px;padding:18px 20px;border:1px solid var(--border-color,#d9dee7);border-left:4px solid var(--accent-color,#2b6cb0);border-radius:10px;background:var(--bg-card,#fff)}
.ax-gm-h{margin:0 0 4px;font-weight:700;font-size:1.05rem;color:var(--text-primary,#111)}
.ax-gm-sub{margin:0 0 12px;font-size:.9rem;color:var(--text-secondary,#555)}
.ax-gm-form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:8px}
.ax-gm-form input{min-width:0;padding:10px 12px;border:1px solid var(--border-color,#cfd6e0);border-radius:8px;font:inherit;font-size:.95rem;background:var(--bg-primary,#fff);color:var(--text-primary,#111)}
.ax-gm-form button{padding:10px 16px;border:0;border-radius:8px;font:inherit;font-weight:700;background:var(--accent-color,#2b6cb0);color:#fff;cursor:pointer;white-space:nowrap}
.ax-gm-form button[disabled]{opacity:.6;cursor:wait}
.ax-gm-hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.ax-gm-err{margin:10px 0 0;font-size:.9rem;color:#b42318}
.ax-gm-alt{margin:12px 0 0;font-size:.9rem;color:var(--text-secondary,#555)}
@media (max-width:700px){.ax-gm-form{grid-template-columns:1fr}}
</style>
<aside class="ax-gm" aria-labelledby="ax-gm-h">
<p class="ax-gm-h" id="ax-gm-h">Get matched in 24 hours, no hard credit pull</p>
<p class="ax-gm-sub">No cost, no obligation. You finish a short application on the next page.</p>
<form class="ax-gm-form" id="axGetMatched">
<input aria-label="Full name" autocomplete="name" name="name" placeholder="Full name" required="" type="text"/>
<input aria-label="Email" autocomplete="email" inputmode="email" name="email" placeholder="Email" required="" type="email"/>
<input aria-label="Phone" autocomplete="tel" inputmode="tel" name="phone" placeholder="Phone" required="" type="tel"/>
<label class="ax-gm-hp" aria-hidden="true">Leave blank<input autocomplete="off" name="bot-field" tabindex="-1" type="text"/></label>
<button type="submit">Get matched</button>
</form>
<p class="ax-gm-err" hidden="" id="axGetMatchedErr">Sorry, that didn't send. Please call us at <a href="tel:+15612680465">(561) 268-0465</a> or try again.</p>
<p class="ax-gm-alt">{{MONEY_LINE}}</p>
</aside>
<form aria-hidden="true" data-netlify="true" hidden="" name="citation-block" netlify-honeypot="bot-field"><input name="name" type="text"/><input name="email" type="text"/><input name="phone" type="text"/><input name="lead_type" type="text"/><input name="page_url" type="text"/><input name="lead_source" type="text"/><input name="lead_channel" type="text"/><input name="lead_referrer" type="text"/><input name="lead_landing_page" type="text"/><input name="lead_submitted_from" type="text"/><input name="utm_source" type="text"/><input name="utm_medium" type="text"/><input name="utm_campaign" type="text"/><input name="utm_term" type="text"/><input name="utm_content" type="text"/><input name="gclid" type="text"/><input name="fbclid" type="text"/><input name="msclkid" type="text"/><input name="bot-field"/></form>
<script>/* Get-matched block on the most-cited pages -> the CRM, like the homepage form.
   Sends a front_page lead (lead_type citation-block) with the first-touch attribution
   from script.js, mirrors it into Netlify Forms in case the CRM is down, then hands
   name/email/phone to /match.html through sessionStorage (never the URL: match.html
   loads the Meta, Microsoft and Google tags, which would receive the query string). */
(function(){
  var f=document.getElementById('axGetMatched'); if(!f) return;
  var err=document.getElementById('axGetMatchedErr');
  f.addEventListener('submit',function(e){
    e.preventDefault();
    var v=function(n){var el=f.elements[n];return el&&el.value?String(el.value).trim():'';};
    if(v('bot-field')) return;
    var btn=f.querySelector('button'), label=btn.textContent;
    btn.disabled=true; btn.textContent='Sending...'; if(err) err.hidden=true;
    var attr=(typeof window.__axAttr==='function'?window.__axAttr():{});
    var lead={name:v('name'),email:v('email'),phone:v('phone')};
    var crm=fetch('/.netlify/functions/apply',{method:'POST',keepalive:true,
      headers:{'content-type':'application/json'},
      body:JSON.stringify(Object.assign({
        form_type:'front_page', lead_type:'citation-block',
        name:lead.name, email:lead.email, phone:lead.phone,
        message:'Get-matched block on '+location.pathname,
        page_url:location.href,
        ref:(typeof window.__axRef==='function'?window.__axRef():null)
      },attr))
    }).then(function(r){return !!(r&&r.ok);}).catch(function(){return false;});
    var backup;
    try{
      var d=new URLSearchParams(); d.append('form-name','citation-block');
      Object.keys(lead).forEach(function(k){d.append(k,lead[k]);});
      d.append('lead_type','citation-block'); d.append('page_url',location.pathname);
      Object.keys(attr).forEach(function(k){d.append(k,attr[k]);});
      backup=fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:d.toString(),keepalive:true})
        .then(function(r){return !!(r&&r.ok);}).catch(function(){return false;});
    }catch(x){ backup=Promise.resolve(false); }
    Promise.all([crm,backup]).then(function(res){
      if(!res[0]) console.error('Get-matched block: CRM intake failed'+(res[1]?' (Netlify Forms copy stored)':''));
      if(res[0]||res[1]){
        try{ sessionStorage.setItem('ax_prefill',JSON.stringify(Object.assign({at:Date.now()},lead))); }catch(x){}
        location.href='/match.html';
        return;
      }
      btn.disabled=false; btn.textContent=label; if(err) err.hidden=false;
    });
  });
})();</script>
<!-- AXIANT-GETMATCHED:END -->
