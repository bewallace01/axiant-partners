<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="600" height="480" role="img" aria-label="An unpaid net-60 invoice converted into same-week working capital with an 80 to 95 percent advance">
  <defs>
    <linearGradient id="ifBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d7fb8"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="ifStrip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#2d7fb8"/>
    </linearGradient>
    <linearGradient id="ifCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef3f8"/>
    </linearGradient>
    <radialGradient id="ifGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <filter id="ifShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#06122a" flood-opacity="0.38"/>
    </filter>
    <marker id="ifArrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7dd3fc"/>
    </marker>
  </defs>

  <!-- ambient glow -->
  <ellipse cx="310" cy="240" rx="260" ry="210" fill="url(#ifGlow)"/>

  <!-- faint dotted accent -->
  <g fill="#7dd3fc" opacity="0.18">
    <circle cx="540" cy="70" r="4"/><circle cx="565" cy="100" r="3"/><circle cx="520" cy="105" r="2.5"/>
    <circle cx="70" cy="400" r="4"/><circle cx="50" cy="370" r="2.5"/><circle cx="95" cy="420" r="3"/>
  </g>

  <!-- INVOICE CARD (tilted) -->
  <g transform="rotate(-7 175 250)" filter="url(#ifShadow)">
    <rect x="55" y="95" width="240" height="305" rx="16" fill="url(#ifCard)"/>
    <path d="M55 111 a16 16 0 0 1 16 -16 h208 a16 16 0 0 1 16 16 v34 h-240 z" fill="url(#ifStrip)"/>
    <text x="79" y="128" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="1">INVOICE</text>
    <!-- NET 60 pill (the waiting problem) -->
    <rect x="206" y="113" width="66" height="22" rx="11" fill="#0d1f3c" opacity="0.35"/>
    <text x="239" y="128" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">NET 60</text>
    <!-- bill-to lines -->
    <rect x="79" y="166" width="150" height="9" rx="4.5" fill="#cdd9e6"/>
    <rect x="79" y="184" width="96" height="9" rx="4.5" fill="#dde6ef"/>
    <!-- line items -->
    <rect x="79" y="222" width="196" height="8" rx="4" fill="#e4ebf3"/>
    <rect x="79" y="244" width="196" height="8" rx="4" fill="#e4ebf3"/>
    <rect x="79" y="266" width="196" height="8" rx="4" fill="#e4ebf3"/>
    <line x1="79" y1="296" x2="275" y2="296" stroke="#cdd9e6" stroke-width="2" stroke-dasharray="4 5"/>
    <!-- total -->
    <text x="79" y="338" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#64748b">Amount due</text>
    <text x="79" y="372" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#1e3a5f">$24,800</text>
  </g>

  <!-- TRANSFORM ARROW -->
  <path d="M300 250 C 332 232, 348 232, 372 232" fill="none" stroke="#7dd3fc" stroke-width="6" stroke-linecap="round" marker-end="url(#ifArrow)"/>

  <!-- FUNDED CARD -->
  <g filter="url(#ifShadow)">
    <rect x="338" y="120" width="222" height="248" rx="18" fill="url(#ifCard)"/>
  </g>
  <!-- $ badge -->
  <circle cx="378" cy="166" r="26" fill="url(#ifBadge)"/>
  <text x="378" y="176" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#ffffff">$</text>
  <!-- funded label + check -->
  <text x="416" y="158" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e3a5f">Funded</text>
  <g transform="translate(416 168)">
    <circle cx="9" cy="9" r="9" fill="#22c55e"/>
    <path d="M5 9.5 L8 12.5 L13.5 6" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="438" y="183" font-family="Inter, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#64748b">this week</text>

  <!-- advance % -->
  <text x="364" y="244" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" fill="#2d7fb8">80&#8211;95%</text>
  <text x="364" y="266" font-family="Inter, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#64748b">advanced upfront</text>

  <!-- upward trend -->
  <polyline points="364,330 398,312 432,320 466,292 502,300 534,276" fill="none" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ifArrow)"/>
  <circle cx="364" cy="330" r="3.5" fill="#2d7fb8"/>
  <circle cx="432" cy="320" r="3.5" fill="#2d7fb8"/>
  <circle cx="502" cy="300" r="3.5" fill="#2d7fb8"/>

  <!-- 24 hr badge -->
  <g transform="translate(430 96)">
    <rect x="0" y="0" width="138" height="34" rx="17" fill="#0d1f3c"/>
    <circle cx="19" cy="17" r="9" fill="none" stroke="#7dd3fc" stroke-width="2"/>
    <path d="M19 12 V17 L22.5 19" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round"/>
    <text x="36" y="22" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Funds in 24 hrs</text>
  </g>

  <!-- coins -->
  <g transform="translate(486 350)">
    <ellipse cx="0" cy="20" rx="34" ry="11" fill="#1e3a5f"/>
    <ellipse cx="0" cy="12" rx="34" ry="11" fill="#2d7fb8"/>
    <ellipse cx="0" cy="4" rx="34" ry="11" fill="#7dd3fc"/>
    <text x="0" y="9" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#0d1f3c">$</text>
  </g>
</svg>
