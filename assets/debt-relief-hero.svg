<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img" aria-label="Stacked business debt payments shrinking into one manageable payment with an upward recovery trend">
  <defs>
    <linearGradient id="drBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#2d7fb8"/>
    </linearGradient>
    <linearGradient id="drBarFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bae6fd"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="drShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0b1f3c" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- dashboard panel -->
  <rect x="40" y="48" width="480" height="364" rx="20"
        fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" filter="url(#drShadow)"/>

  <!-- panel header -->
  <rect x="68" y="78" width="150" height="12" rx="6" fill="rgba(255,255,255,0.45)"/>
  <rect x="68" y="100" width="96" height="9" rx="4.5" fill="rgba(255,255,255,0.22)"/>
  <circle cx="486" cy="92" r="18" fill="rgba(125,211,252,0.18)" stroke="#7dd3fc" stroke-width="2"/>
  <path d="M478 92 l6 6 11-12" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- baseline -->
  <line x1="76" y1="372" x2="484" y2="372" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>

  <!-- descending bars: stacked debt shrinking left to right -->
  <rect x="92"  y="196" width="56" height="176" rx="8" fill="url(#drBar)"/>
  <rect x="168" y="236" width="56" height="136" rx="8" fill="url(#drBar)"/>
  <rect x="244" y="276" width="56" height="96"  rx="8" fill="url(#drBar)"/>
  <rect x="320" y="312" width="56" height="60"  rx="8" fill="url(#drBarFade)"/>
  <rect x="396" y="340" width="56" height="32"  rx="8" fill="url(#drBarFade)"/>

  <!-- recovery trend line + arrowhead -->
  <polyline points="104,176 196,224 272,268 352,300 432,318"
            fill="none" stroke="#fbbf24" stroke-width="5"
            stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="104" cy="176" r="7" fill="#fbbf24"/>
  <path d="M432 318 l22 -10 m-22 10 l14 18" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- "one payment" tag -->
  <g transform="translate(372,392)">
    <rect x="0" y="0" width="116" height="40" rx="20" fill="#fbbf24"/>
    <text x="58" y="26" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#0b1f3c">One payment</text>
  </g>
</svg>
