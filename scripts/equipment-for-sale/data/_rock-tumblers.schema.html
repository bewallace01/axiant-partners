    {"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What does an industrial rock tumbler do?","acceptedAnswer":{"@type":"Answer","text":"It tumbles rock, aggregate or stone in a rotating drum with water, stripping dirt, clay and fines and knocking the sharp edges off. The output is clean, graded material that can be sold, rather than dirty rock that has to be hauled away."}},{"@type":"Question","name":"How much rock can it process?","acceptedAnswer":{"@type":"Answer","text":"The two tumblers here are 8,000 lb and 14,000 lb capacity. Choose on the volume you need to move in a working day rather than on the size of the pile, and remember that feed and stockpiling — not the drum — are usually what limits real throughput."}},{"@type":"Question","name":"What are the conveyor and the thin-stone saw for?","acceptedAnswer":{"@type":"Answer","text":"The belted chain conveyor feeds the tumbler and stockpiles its output, so a loader and operator are not tied up every cycle. The thin-stone saw cuts veneer and thin stone, which is the highest-value product on this page — it turns raw rock into architectural stone."}},{"@type":"Question","name":"Can I finance a rock tumbler and the accessories?","acceptedAnswer":{"@type":"Answer","text":"Yes, and they are usually financed together, because the tumbler on its own tends to move the bottleneck rather than remove it. It is asset-based equipment financing with terms set to the life of the machines. Get the Mix Right quote and use the estimator above."}}]}
