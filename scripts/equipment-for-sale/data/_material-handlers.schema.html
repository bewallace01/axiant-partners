    {"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is the difference between a material handler and an excavator?","acceptedAnswer":{"@type":"Answer","text":"An excavator is built to dig, with a short heavy boom and high breakout force. A material handler is built to reach, lift and cycle loose material all day: a longer boom, an elevating cab so the operator sees into the truck or the pile, and hydraulics tuned for repeated swings. Using an excavator for scrap or recycling work costs you cycle time, fuel and wear."}},{"@type":"Question","name":"What size material handler does a scrap yard need?","acceptedAnswer":{"@type":"Answer","text":"Most scrap yards land on the 825 E class, at roughly 46 ft of reach, which works across a trailer and feeds a shredder while still transporting easily. Indoor sorting and transfer stations often go smaller (818 E or 821 E), while log decks, barge loading and ports go bigger."}},{"@type":"Question","name":"How much does a material handler cost?","acceptedAnswer":{"@type":"Answer","text":"It varies widely with size, power type and attachments, and SENNEBOGEN prices through its dealers rather than publishing list prices. A mid-size machine is generally a high six-figure purchase and the largest port machines run well beyond that. Ask the dealer for a quote on your exact configuration; Axiant can size the monthly payment."}},{"@type":"Question","name":"Can I finance a new or used material handler?","acceptedAnswer":{"@type":"Answer","text":"Yes, both, including dealer-refurbished machines. Equipment financing is asset-based, so a machine that holds its value carries much of the deal. Approvals commonly come back in about 24 hours."}}]}
