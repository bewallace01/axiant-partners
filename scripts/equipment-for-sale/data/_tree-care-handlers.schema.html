    {"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is a tree care handler?","acceptedAnswer":{"@type":"Answer","text":"A telescopic-boom machine with a hydraulic grapple saw and an elevating operator cab. The operator grips the stem, cuts it and sets the section down under control, so the tree is removed upright from the ground without a climber in the canopy or anyone under a falling piece."}},{"@type":"Question","name":"Is a tree care handler better than a bucket truck or crane?","acceptedAnswer":{"@type":"Answer","text":"For hazardous, dead and roadside trees it is usually safer, because the machine holds the wood the whole time rather than dropping it, and it cuts and loads with one operator. A bucket truck is still lighter and cheaper for routine pruning, so most established outfits run both."}},{"@type":"Question","name":"How much does a tree care handler cost?","acceptedAnswer":{"@type":"Answer","text":"SENNEBOGEN sells through dealers and does not publish list prices. Cost scales with reach, undercarriage and attachments. Ask your dealer to quote the configuration you need, and ask Axiant what that means as a monthly payment."}},{"@type":"Question","name":"Can I finance a tree care handler, new or used?","acceptedAnswer":{"@type":"Answer","text":"Yes, both. Financing is asset-based, so the machine carries much of the deal, which is what puts it in reach of a growing tree service rather than only the largest crews. Approvals commonly come back in about 24 hours."}}]}
