    {"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is the difference between a wet batch plant and a dry batch plant?","acceptedAnswer":{"@type":"Answer","text":"A wet batch plant has a central mixer: it mixes the concrete inside the plant and discharges it finished and ready to place. A dry batch plant only weighs and dispenses the dry materials into a mixer truck, and the truck does the mixing on the way to the pour. Put simply, a wet plant produces concrete; a dry plant produces a truckload of ingredients."}},{"@type":"Question","name":"How much concrete can a wet batch plant produce?","acceptedAnswer":{"@type":"Answer","text":"These plants batch from about 1.3 up to 4 cubic yards at a time, with up to 24 yards of aggregate storage across two bins. Your real output depends on batch size and how quickly the plant gets reloaded, so match the batch size to your pour rate and the storage to how long you want to run between loader trips."}},{"@type":"Question","name":"Do I still need a mixer truck?","acceptedAnswer":{"@type":"Answer","text":"No. That is the point of a wet plant. It discharges mixed concrete, so it can feed a buggy, a pump, a dumper or a small transport unit directly. A dry batch plant is the one that depends on a mixer truck, because the truck is where the mixing happens."}},{"@type":"Question","name":"Can I finance a concrete batch plant?","acceptedAnswer":{"@type":"Answer","text":"Yes. Equipment financing is asset-based, so a durable, portable plant that holds its value carries much of the deal itself. Mix Right quotes rather than publishing prices, so get a quote for your configuration and Axiant can size the monthly payment. Approvals commonly come back in about 24 hours."}}]}
