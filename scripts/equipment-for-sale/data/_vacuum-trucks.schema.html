    {"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is a vacuum truck used for?","acceptedAnswer":{"@type":"Answer","text":"A vacuum truck pumps liquids, slurry and waste into an onboard tank using a vacuum pump or blower, then hauls it away. In septic and portable sanitation work it pumps septic tanks, grease traps and portable restrooms; it is different from a tanker truck, which only hauls liquid it does not pump."}},{"@type":"Question","name":"What size vacuum truck do I need?","acceptedAnswer":{"@type":"Answer","text":"Match the tank to your routes. Residential and portable-restroom service is usually handled by a 1,500 to 2,500 gallon truck, often with a non-CDL option; high-volume commercial, grease and municipal work leans toward 3,500 to 6,000 gallon trucks with a bigger blower and hydraulic dump."}},{"@type":"Question","name":"How much does a vacuum truck cost?","acceptedAnswer":{"@type":"Answer","text":"It ranges widely with tank size, pump and whether it is new or used — a used unit can run into the low six figures while a large new vacuum truck reaches the mid-to-high six figures. The monthly payment usually matters more, and financing sizes it to the work the truck brings in."}},{"@type":"Question","name":"Can I finance a septic or vacuum truck, new or used?","acceptedAnswer":{"@type":"Answer","text":"Yes — both new and used. Truck financing is asset-based, so the equipment carries much of the deal. Apply once through Axiant to get matched with terms, or read our guide on financing a septic vacuum truck."}}]}
